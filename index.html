<!DOCTYPE html>
<html>
<head>
    <title>Piccadilly 261: Heritage Engine 2026</title>
    <style>
        body { background: #0a0a0a; color: #FFD700; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .studio { max-width: 800px; margin: auto; border: 4px solid #FFD700; background: #151515; padding: 25px; border-radius: 15px; box-shadow: 0 0 30px #FFD70033; }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 5px; }
        textarea { width: 100%; height: 100px; background: #222; color: #FFD700; border: 1px solid #444; padding: 15px; border-radius: 8px; font-size: 1.1em; }
        button { width: 100%; padding: 18px; background: #FFD700; color: #000; font-weight: bold; font-size: 1.3em; cursor: pointer; border: none; border-radius: 8px; margin-top: 10px; text-transform: uppercase; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
        #output { margin-top: 25px; }
        .card { background: #222; border-left: 8px solid #FFD700; padding: 20px; border-radius: 0 10px 10px 0; margin-bottom: 15px; line-height: 1.6; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="studio">
        <h1>PICCADILLY 261</h1>
        <p style="text-align: center; color: #888;">Heritage AI Producer | 2026 Stable Signal</p>
        <textarea id="playlist" placeholder="Paste your songs here (Artist - Song)..."></textarea>
        <button onclick="runShow()">Open the Archives</button>
        <div id="status"></div>
        <div id="output"></div>
    </div>

<script>
async function runShow() {
    const list = document.getElementById('playlist').value;
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    
    // YOUR 2026 KEY
    const key = AIzaSyBYF10ZegyZmKXKCvR68l3B_rweegv8Xro    if(!list) return alert("Nothing in the faders, mate!");
    
    status.innerHTML = "📡 ATTEMPTING HANDSHAKE WITH MANCHESTER ARCHIVES...";
    output.innerHTML = "";

    const prompt = `You are the Lead Heritage Producer for Piccadilly Radio 261. Target Audience: Age 45-60. 
    For each song, find the UK Peak Year and provide: [I] A Manchester/NW event from that year, [C] A regional landmark memory (261 bus, Belle Vue), [E] Irish-Mancunian wit. 
    Playlist: ${list}`;

    try {
        // USE THE STABLE 2.5 FLASH FREQUENCY
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
        
        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();

        if (data.error) {
            status.innerHTML = `<span style='color:red;'>❌ SIGNAL ERROR: ${data.error.message}</span>`;
        } else {
            status.innerHTML = "<span style='color:lightgreen;'>✅ SIGNAL LOCKED - ARCHIVES OPEN</span>";
            const text = data.candidates[0].content.parts[0].text;
            output.innerHTML = text.split(/\n\s*\n/).map(section => 
                `<div class="card">${section.replace(/\n/g, '<br>')}</div>`
            ).join('');
        }
    } catch (e) {
        status.innerHTML = "<span style='color:red;'>❌ SECURITY BLOCK: Browser is stopping the script. Paste this page's URL into Firefox or an Incognito window!</span>";
    }
}
</script>
</body>
</html>
